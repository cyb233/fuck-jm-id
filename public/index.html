<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuck JMComic ID</title>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noimageindex">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js/dist/ofa.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js/libs/scsr/dist/scsr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sober@1/dist/sober.min.js"></script>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    o-app {
      width: 100%;
      display: block;
      position: static;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered:', reg))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</head>
<body>
  <o-app>
    <template page>
      <style>
        .center {
          text-align: center;
        }

        .left {
          text-align: left;
        }

        .right {
          text-align: right;
        }

        .hide {
          display: none;
        }

        .related-list {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
          align-items: stretch;
          justify-items: stretch;
        }

        .related-card {
          display: flex;
          flex-direction: column;
          height: 100%;
          padding: 16px;
          max-width: 100%;
          box-sizing: border-box;
        }

        .related-card img {
          height: 160px;
        }

        .search-history-shell {
          display: flex;
          align-items: center;
          gap: 8px;
          width: min(720px, 100%);
          margin: 8px auto 0;
        }

        .search-history-shell-expanded {
          flex-wrap: wrap;
          justify-content: flex-end;
        }

        .search-history {
          display: flex;
          flex: 1 1 auto;
          gap: 8px;
          min-width: 0;
          padding: 2px 0 6px;
          overflow-x: auto;
          overscroll-behavior-x: contain;
          white-space: nowrap;
        }

        .search-history-expanded {
          flex-wrap: wrap;
          overflow-x: visible;
          white-space: normal;
        }

        .history-item {
          display: inline-flex;
          flex: 0 0 auto;
          align-items: center;
          min-width: max-content;
        }

        .search-history-expanded .history-item {
          flex: 0 1 auto;
        }

        .history-item s-tooltip {
          flex: 0 0 auto;
          min-width: 0;
        }

        .history-item s-tooltip::part(popup) {
          max-width: min(520px, calc(100vw - 32px));
          white-space: normal;
          overflow-wrap: anywhere;
        }

        .history-tooltip-empty::part(popup) {
          display: none !important;
        }

        .history-chip {
          max-width: 220px;
        }

        .history-chip-label-no-result {
          text-decoration: line-through;
          text-decoration-thickness: 1.5px;
        }

        .history-chip-current {
          --s-color-surface-container-high: var(--s-color-secondary-container, #cfe6f1);
          --s-color-on-surface: var(--s-color-primary, #006782);
        }

        .history-chip-searched {
          --s-color-surface-container-high: #eef0f2;
          --s-color-on-surface: #70787d;
          opacity: .76;
        }

        .history-delete {
          width: 28px;
          height: 28px;
          padding: 4px;
          flex: 0 0 auto;
        }

        .search-history-count {
          flex: 0 0 auto;
          line-height: 32px;
          font-size: .8125rem;
          color: var(--s-color-on-surface-variant, #40484C);
          white-space: nowrap;
        }
      </style>
      <l-m src="./component/github-corner.html"></l-m>
      <github-corner href="https://github.com/cyb233/fuck-jm-id"></github-corner>
      <h1 class="center" style="margin: 16px">Fuck JMComic ID</h1>
      <div class="center" style="margin: 16px">
        <s-search id="search" placeholder="JMID" aria-label="JMID" on:input="jmid = $event.target.value">
          <s-icon name="search" slot="start"></s-icon>
          <s-icon-button slot="end" on:click="clearSearch()">
            <s-icon name="close"></s-icon>
          </s-icon-button>
        </s-search>
        <o-if :value="searchHistory.length">
          <div class="search-history-shell" class:search-history-shell-expanded="historyExpanded">
            <div class="search-history" class:search-history-expanded="historyExpanded">
              <o-fill :value="searchHistory">
                <div class="history-item" attr:id="'history-' + $data.id">
                  <s-tooltip align="top" class:history-tooltip-empty="!$data.title">
                    <s-chip slot="trigger" class="history-chip" class:history-chip-current="$data.current" class:history-chip-searched="$data.searched && !$data.current" clickable="false" on:click="$host.searchHistoryItem($data.id)">
                      <span class:history-chip-label-no-result="$data.noResult">{{ $data.id }}</span>
                      <s-icon-button class="history-delete" slot="action" on:click="$host.deleteSearchHistory($data.id, $event)">
                        <s-icon name="close"></s-icon>
                      </s-icon-button>
                    </s-chip>
                    {{ $data.title || '' }}
                  </s-tooltip>
                </div>
              </o-fill>
            </div>
            <span class="search-history-count">共 {{ searchHistory.length }} 条</span>
            <o-if :value="historyExpanded">
              <s-icon-button on:click="historyExpanded = false" aria-label="收起搜索历史">
                <s-icon name="chevron_up"></s-icon>
              </s-icon-button>
            </o-if>
            <o-else>
              <s-icon-button on:click="historyExpanded = true" aria-label="展开搜索历史">
                <s-icon name="chevron_down"></s-icon>
              </s-icon-button>
            </o-else>
          </div>
        </o-if>
      </div>
      <div class="center" style="margin: 16px">
        显示图片
        <s-switch style="margin-left: 16px;" on:change="showImg = $event.target.checked"></s-switch>
      </div>
      <div class="center" style="margin: 16px">
        <o-if :value="loadingComicInfo">
          <s-circular-progress indeterminate="true"></s-circular-progress>
        </o-if>
        <o-else-if :value="hasComicResult">
          <s-card style="display: inline-block; max-width: fit-content; padding: 24px;">
            <div slot="image">
              <o-if :value="comicInfo.id && showImg">
                <img attr:src="coverImgUrl()" attr:alt="comicInfo.name || ('JM ' + comicInfo.id)" style="height: 160px;" on:error="imgErrorTimes++" />
              </o-if>
            </div>
            <div slot="headline"><a attr:href="'https://18comic.vip/album/' + comicInfo.id" target="_blank">{{comicInfo.name}}</a></div>
            <div slot="subhead">
              作者：
              <o-if :value="comicInfo.author && Array.isArray(comicInfo.author)">
                <o-fill :value="comicInfo.author">
                  <s-chip clickable="false">
                    {{ $data }}
                  </s-chip>
                </o-fill>
              </o-if>
            </div>
            <div slot="text">ID：{{comicInfo.id}}</div>
            <o-if :value="comicInfo.works && Array.isArray(comicInfo.works) && comicInfo.works.length">
              <div slot="text">作品：
                <o-fill :value="comicInfo.works">
                  <s-chip clickable="false">
                    {{ $data }}
                  </s-chip>
                </o-fill>
              </div>
            </o-if>
            <o-if :value="comicInfo.series && Array.isArray(comicInfo.series) && comicInfo.series.length">
              <div slot="text">系列：
                <o-fill :value="comicInfo.series">
                  <s-chip attr:clickable="$data.id" on:click="$host.searchByJmid($data.id)">
                    第{{ $data.sort }}话 {{ $data.name }}
                  </s-chip>
                </o-fill>
              </div>
            </o-if>
            <o-if :value="comicInfo.actors && Array.isArray(comicInfo.actors) && comicInfo.actors.length">
              <div slot="text">角色：
                <o-fill :value="comicInfo.actors">
                  <s-chip clickable="false">
                    {{ $data }}
                  </s-chip>
                </o-fill>
              </div>
            </o-if>
            <o-if :value="comicInfo.tags && Array.isArray(comicInfo.tags) && comicInfo.tags.length">
              <div slot="text">标签：
                <o-fill :value="comicInfo.tags">
                  <s-chip clickable="false">
                    {{ $data }}
                  </s-chip>
                </o-fill>
              </div>
            </o-if>
            <div slot="text">
              <s-chip clickable="false">
                浏览量：{{comicInfo?.total_views || 0}}
              </s-chip>
              <s-chip clickable="false">
                点赞数：{{comicInfo?.likes || 0}}
              </s-chip>
              <s-chip clickable="false">
                评论数：{{comicInfo?.comment_total || 0}}
              </s-chip>
              <s-chip clickable="false">
                上传时间：{{comicInfo?.addtime ? new Date(comicInfo.addtime * 1000).toLocaleString() : '-'}}
              </s-chip>
            </div>
            <o-if :value="comicInfo.description">
              <div slot="text">简介：{{comicInfo?.description}}</div>
            </o-if>
            <s-button slot="action" on:click="copyTitle()">
              <s-icon slot="start">
                <svg viewBox="0 -960 960 960">
                  <path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"></path>
                </svg>
              </s-icon>
              复制完整标题
            </s-button>
          </s-card>
          <o-if :value="comicInfo.related_list && Array.isArray(comicInfo.related_list) && comicInfo.related_list.length">
            <s-fold folded="true">
              <s-button slot="trigger" style="margin: 16px;">相关推荐</s-button>
              <div class="related-list" style="margin: 16px;">
                <o-fill :value="comicInfo.related_list">
                  <s-card class="related-card">
                    <div slot="image">
                      <o-if :value="$data.id && $host.showImg">
                        <img attr:src="$host.imgUrl($data.id)" attr:alt="$data.name || ('JM ' + $data.id)" on:error="$host.imgErrorTimes[$data.id]++" />
                      </o-if>
                    </div>
                    <div slot="headline"><a attr:href="'https://18comic.vip/album/' + $data.id" target="_blank">{{ $data.name }}</a></div>
                    <div slot="subhead">
                      作者：
                      <o-if :value="$data.author">
                        {{ $data?.author }}
                      </o-if>
                    </div>
                    <s-button slot="action" on:click="$host.searchByJmid($data.id)">
                      ID：{{ $data.id }}
                      <s-icon name="search" slot="end"></s-icon>
                    </s-button>
                  </s-card>
                </o-fill>
              </div>
            </s-fold>
          </o-if>
        </o-else-if>
        <o-else>
          <s-empty>暂时没有数据</s-empty>
          <s-alert id="alert" type="error" class:hide="!comicInfoAlert">
            {{ comicInfoAlert }}
            <s-icon-button slot="end" on:click="comicInfoAlert = ''">
              <s-icon name="close"></s-icon>
            </s-icon-button>
          </s-alert>
        </o-else>
      </div>
      <div class="center" style="margin: 16px">
        <o-if :value="searchResult.length">
          <s-table style="overflow: auto; display: block">
            <s-tbody>
              <o-fill :value="searchResult">
                <s-tr>
                  <s-td class="right" style="width: 50%;"><s-icon attr:src="$data.logo"></s-icon>{{ $data.site }}</s-td>
                  <s-td class="left" style="width: 50%;">
                    <o-if :value="$data.search">
                      <a attr:href="$data.search" target="_blank">{{ $data.title }}</a>
                    </o-if>
                    <o-else>
                      {{ $data.title }}
                    </o-else>
                  </s-td>
                </s-tr>
              </o-fill>
            </s-tbody>
          </s-table>
        </o-if>
        <o-else-if :value="hasComicResult">
          <s-empty>暂时没有数据</s-empty>
        </o-else-if>
      </div>
      <s-snackbar id="copySuccess" type="success">
        复制成功
      </s-snackbar>
      <script>
        export default {
          data: {
            showImg: false,
            jmid: '',
            currentJmid: '',
            searchHistory: [],
            historyExpanded: false,
            comicInfo: {},
            hasComicResult: false,
            searchResult: [],
            loadingComicInfo: false,
            comicInfoAlert: '',
            imgErrorTimes: {},
            imeStatus: false,
          },
          ready() {
            // 回车键搜索
            const search = this.shadow.$('#search');
            search.on('keyup', e => {
              if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                this.searchFromInput();
              }
            });

            // 首次加载时从hash中读取jmid值
            const hash = window.location.hash;
            if (hash && hash.length > 1) {
              this.jmid = decodeURIComponent(hash.substring(1)); // 去掉#符号
              this.updateSearch();
              this.searchByJmid(this.jmid);
            }

            // 监听hash变化
            window.addEventListener('hashchange', () => {
              const newHash = window.location.hash;
              if (newHash && newHash.length > 1) {
                const newJmid = decodeURIComponent(newHash.substring(1));
                if (this.jmid !== newJmid) {
                  this.jmid = newJmid;
                  this.updateSearch();
                  this.searchByJmid(newJmid);
                }
              } else {
                if (this.jmid !== '') {
                  this.jmid = '';
                  this.updateSearch();
                }
              }
            });

            // 监听输入法状态变化
            window.addEventListener('compositionstart', () => {
              this.imeStatus = true;
            });
            window.addEventListener('compositionend', () => {
              this.imeStatus = false;
            });
          },
          proto: {
            formatJMID(jmid) {
              const input = String(jmid || '').trim();
              const matches = input.match(/JM\s*\d+|\d+/gi) || [];
              const seen = new Set();
              return matches
                .map(item => {
                  const id = item.replace(/\D/g, '');
                  return id ? `JM${id}` : '';
                })
                .filter(item => {
                  if (!item || seen.has(item)) {
                    return false;
                  }
                  seen.add(item);
                  return true;
                });
            },
            searchFromInput() {
              if (this.imeStatus) {
                return;
              }
              const jmids = this.formatJMID(this.jmid);
              if (!jmids.length) {
                return;
              }
              this.upsertSearchHistory(jmids, jmids[0]);
              this.searchByJmid(jmids[0], { keepHistoryOrder: true });
            },
            async searchByJmid(jmid = this.jmid, options = {}) {
              this.clearAlerts();
              const jmids = this.formatJMID(jmid);
              const targetJmid = jmids[0];
              if (!targetJmid) {
                return;
              }
              if (!options.keepHistoryOrder) {
                this.upsertSearchHistory([targetJmid], targetJmid);
              }
              this.currentJmid = targetJmid;
              this.markCurrentHistory(targetJmid);
              this.updateSearchHistoryItem(targetJmid, {
                searched: true,
              });
              this.scrollCurrentHistoryIntoView(targetJmid);
              this.jmid = targetJmid;
              this.updateSearch();
              this.updateHash(targetJmid);
              const currentInfoJmid = this.formatJMID(this.comicInfo?.id)[0];
              if (this.hasComicResult && currentInfoJmid === targetJmid) {
                this.updateSearchHistoryItem(targetJmid, {
                  searched: true,
                  title: this.comicInfo.name,
                  noResult: !this.hasComicResult,
                });
                this.scrollCurrentHistoryIntoView(targetJmid);
                return;
              }
              this.comicInfo = {};
              this.hasComicResult = false;
              this.searchResult = [];
              this.loadingComicInfo = true;
              this.imgErrorTimes = {};
              try {
                const jmComicInfoResp = await fetch(`/getInfo/${encodeURIComponent(targetJmid)}`)
                const jmComicInfo = await jmComicInfoResp.json()
                if (jmComicInfo.error) {
                  throw new Error(jmComicInfo.error);
                }
                this.comicInfo = jmComicInfo.comicInfo || {};
                this.hasComicResult = Boolean(jmComicInfo.hasComicResult);
                this.searchResult = jmComicInfo.searchResult || [];
                this.updateSearchHistoryItem(targetJmid, {
                  searched: true,
                  title: this.comicInfo.name || '',
                  noResult: !this.hasComicResult,
                });
                if (this.hasComicResult) {
                  this.scrollCurrentHistoryIntoView(targetJmid);
                }
              } catch (err) {
                console.error(err);
                this.comicInfoAlert = err.message || '获取漫画信息失败';
              } finally {
                this.loadingComicInfo = false;
              }
            },
            searchHistoryItem(jmid) {
              return this.searchByJmid(jmid, { keepHistoryOrder: true });
            },
            deleteSearchHistory(jmid, event) {
              event?.stopPropagation?.();
              const targetJmid = this.formatJMID(jmid)[0];
              if (!targetJmid) {
                return;
              }
              this.searchHistory = this.searchHistory.filter(item => item.id !== targetJmid);
              if (!this.searchHistory.length) {
                this.historyExpanded = false;
              }
            },
            upsertSearchHistory(jmids, searchedJmid) {
              const normalizedJmids = [];
              const movedIds = new Set();
              for (const jmid of jmids) {
                for (const normalizedJmid of this.formatJMID(jmid)) {
                  if (!movedIds.has(normalizedJmid)) {
                    normalizedJmids.push(normalizedJmid);
                    movedIds.add(normalizedJmid);
                  }
                }
              }
              if (!normalizedJmids.length) {
                return;
              }
              const normalizedSearchedJmid = this.formatJMID(searchedJmid)[0];
              const previousItems = new Map(this.searchHistory.map(item => [item.id, item]));
              const movedItems = [];
              for (const id of normalizedJmids) {
                const previousItem = previousItems.get(id) || {};
                movedItems.unshift({
                  id,
                  searched: Boolean(previousItem.searched || id === normalizedSearchedJmid),
                  title: previousItem.title || '',
                  noResult: Boolean(previousItem.noResult),
                  current: id === this.currentJmid,
                });
              }
              const remainingItems = this.searchHistory.filter(item => !movedIds.has(item.id));
              this.searchHistory = [...movedItems, ...remainingItems];
            },
            updateSearchHistoryItem(jmid, patch) {
              const targetJmid = this.formatJMID(jmid)[0];
              if (!targetJmid) {
                return;
              }
              const index = this.searchHistory.findIndex(item => item.id === targetJmid);
              if (index === -1) {
                this.searchHistory = [{
                  id: targetJmid,
                  searched: false,
                  title: '',
                  noResult: false,
                  current: targetJmid === this.currentJmid,
                  ...patch,
                }, ...this.searchHistory];
                return;
              }
              const nextHistory = this.searchHistory.slice();
              nextHistory[index] = {
                ...nextHistory[index],
                ...patch,
              };
              this.searchHistory = nextHistory;
            },
            markCurrentHistory(jmid) {
              this.searchHistory = this.searchHistory.map(item => ({
                ...item,
                current: item.id === jmid,
              }));
            },
            scrollCurrentHistoryIntoView(jmid = this.currentJmid) {
              const targetJmid = this.formatJMID(jmid)[0];
              if (!targetJmid) {
                return;
              }
              setTimeout(() => {
                let item;
                try {
                  item = this.shadow.$(`#history-${targetJmid}`)?.ele;
                } catch (err) {
                  item = null;
                }
                item?.scrollIntoView({
                  behavior: 'smooth',
                  block: 'nearest',
                  inline: this.historyExpanded ? 'nearest' : 'center',
                });
              }, 0);
            },
            updateHash(jmid) {
              const nextHash = `#${encodeURIComponent(jmid)}`;
              if (window.location.hash !== nextHash) {
                window.location.hash = nextHash;
              }
            },
            updateSearch() {
              const search = this.shadow.$('#search');
              search.ele.value = this.jmid;
            },
            clearSearch() {
              this.clearAlerts();
              this.jmid = '';
              this.updateSearch();
              history.replaceState(null, null, window.location.pathname + window.location.search);
            },
            copyTitle() {
              if (!this.comicInfo.name) {
                return;
              }
              navigator.clipboard.writeText(this.comicInfo.name).then(() => {
                this.shadow.$('#copySuccess').ele.show();
              });
            },
            clearAlerts() {
              this.comicInfoAlert = '';
            },
            imgUrl(id) {
              if (!id) {
                return '';
              }
              if (!this.imgErrorTimes[id]) {
                this.imgErrorTimes[id] = 0;
              }
              if (this.imgErrorTimes[id] > 2) {
                return '';
              }
              return `https://cdn-msp${['', '2', '3'][this.imgErrorTimes[id] || 0]}.18comic.vip/media/albums/${id}.jpg`
            },
            coverImgUrl() {
              if (this.comicInfo?.cover_base64) {
                return `data:image/jpeg;base64,${this.comicInfo.cover_base64}`;
              }
              return this.imgUrl(this.comicInfo?.id);
            }
          }
        }
      </script>
    </template>
  </o-app>
</body>
</html>
