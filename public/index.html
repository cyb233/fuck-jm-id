<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuck JMComic ID</title>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noimageindex">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js/dist/ofa.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js/libs/scsr/dist/scsr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sober@1/dist/sober.min.js"></script>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 400px;
    }

    o-app {
      width: 100%;
      display: block;
      position: static;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered:', reg))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</head>
<body>
  <o-app>
    <template page>
      <style>
        .center {
          text-align: center;
        }

        .left {
          text-align: left;
        }

        .right {
          text-align: right;
        }

        .hide {
          display: none;
        }
      </style>
      <l-m src="./component/github-corner.html"></l-m>
      <github-corner href="https://github.com/cyb233/fuck-jm-id"></github-corner>
      <h1 class="center" style="margin: 16px">Fuck JMComic ID</h1>
      <div class="center" style="margin: 16px">
        <s-search id="search" placeholder="JMID" aria-label="JMID" on:input="jmid = $event.target.value">
          <s-icon name="search" slot="start"></s-icon>
          <s-icon-button slot="end" on:click="clearSearch()">
            <s-icon name="close"></s-icon>
          </s-icon-button>
        </s-search>
      </div>
      <div class="center" style="margin: 16px">
        <x-if :value="loadingComicInfo">
          <s-circular-progress indeterminate="true"></s-circular-progress>
        </x-if>
        <x-else-if :value="comicInfo.name">
          <s-card style="display: inline-block; max-width: fit-content; padding: 24px;">
            <div slot="image">
              <x-if :value="comicInfo.id">
                <img attr:src="imgUrl(comicInfo.id)" style="height: 160px;" on:error="imgErrorTimes++" />
              </x-if>
            </div>
            <div slot="headline"><a attr:href="'https://18comic.vip/album/' + comicInfo.id" target="_blank">{{comicInfo.name}}</a></div>
            <div slot="subhead">
              作者：
              <x-if :value="comicInfo.author && Array.isArray(comicInfo.author)">
                {{comicInfo?.author?.join(',')}}
              </x-if>
            </div>
            <div slot="text">ID：{{comicInfo.id}}</div>
            <x-if :value="comicInfo.works && Array.isArray(comicInfo.works) && comicInfo.works.length">
              <div slot="text">作品：{{comicInfo?.works?.join(',')}}</div>
            </x-if>
            <x-if :value="comicInfo.tags && Array.isArray(comicInfo.tags) && comicInfo.tags.length">
              <div slot="text">标签：{{comicInfo?.tags?.join(',')}}</div>
            </x-if>
            <div slot="text">
              总浏览量：{{comicInfo?.total_views || 0}}
              |
              喜欢数：{{comicInfo?.likes || 0}}
              |
              评论数：{{comicInfo?.comment_total || 0}}
              |
              上传时间：{{comicInfo?.addtime ? new Date(comicInfo.addtime * 1000).toLocaleString() : '-'}}
            </div>
            <x-if :value="comicInfo.description">
              <div slot="text">简介：{{comicInfo?.description}}</div>
            </x-if>
            <s-button slot="action" on:click="copyTitle()">
              <s-icon slot="start">
                <svg viewBox="0 -960 960 960">
                  <path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"></path>
                </svg>
              </s-icon>
              复制完整标题
            </s-button>
          </s-card>
          <x-if :value="comicInfo.related_list && Array.isArray(comicInfo.related_list) && comicInfo.related_list.length">
            <s-fold folded="true" style="padding: 24px;">
              <s-button slot="trigger">相关推荐</s-button>
              <x-fill :value="comicInfo.related_list">
                <s-card style="display: inline-block; padding: 16px; margin: 8px; max-width: 300px; height: 500px;">
                  <div slot="image">
                    <x-if :value="$data.id">
                      <img attr:src="$host.imgUrl($data.id)" style="height: 160px;" on:error="$host.imgErrorTimes[$data.id]++" />
                    </x-if>
                  </div>
                  <div slot="headline"><a attr:href="'https://18comic.vip/album/' + $data.id" target="_blank">{{ $data.name }}</a></div>
                  <div slot="subhead">
                    作者：
                    <x-if :value="$data.author">
                      {{ $data?.author }}
                    </x-if>
                  </div>
                  <s-button slot="action" on:click="$host.getJmComicInfo($data.id)">
                    ID：{{ $data.id }}
                    <s-icon name="search" slot="end"></s-icon>
                  </s-button>
                </s-card>
              </x-fill>
            </s-fold>
          </x-if>
        </x-else-if>
        <x-else>
          <s-empty>暂时没有数据</s-empty>
          <s-alert id="alert" type="error" class:hide="!comicInfoAlert">
            {{ comicInfoAlert }}
            <s-icon-button slot="end" on:click="comicInfoAlert = ''">
              <s-icon name="close"></s-icon>
            </s-icon-button>
          </s-alert>
        </x-else>
      </div>
      <div class="center" style="margin: 16px">
        <x-if :value="searchResult.length">
          <s-table style="overflow: auto; display: block">
            <s-tbody>
              <x-fill :value="searchResult">
                <s-tr>
                  <s-td class="right" style="width: 50%;"><s-icon attr:src="$data.logo"></s-icon>{{ $data.site }}</s-td>
                  <s-td class="left" style="width: 50%;">
                    <x-if :value="$data.search">
                      <a attr:href="$data.search" target="_blank">{{ $data.title }}</a>
                    </x-if>
                    <x-else>
                      {{ $data.title }}
                    </x-else>
                  </s-td>
                </s-tr>
              </x-fill>
            </s-tbody>
          </s-table>
        </x-if>
        <x-else-if :value="comicInfo.name">
          <s-empty>暂时没有数据</s-empty>
        </x-else-if>
      </div>
      <s-snackbar id="copySuccess" type="success">
        复制成功
      </s-snackbar>
      <script>
        export default {
          data: {
            jmid: '',
            comicInfo: {},
            searchResult: [],
            loadingComicInfo: false,
            comicInfoAlert: '',
            imgErrorTimes: {},
            imeStatus: false,
          },
          watch: {
            jmid(val) {
              if (this.imeStatus) {
                return;
              }
              this.jmid = this.formatJMID(this.jmid);
              this.updateSearch();
              // 同步jmid到URL hash
              if (val) {
                window.location.hash = `#${val}`;
              } else {
                // 如果jmid为空，清除hash
                history.replaceState(null, null, window.location.pathname + window.location.search);
              }
            },
          },
          ready() {
            // 回车键搜索
            const search = this.shadow.$('#search');
            search.on('keyup', e => {
              if (e.keyCode === 13) {
                if (!this.comicInfo.id || this.comicInfo.id != this.jmid || !this.comicInfo.name) {
                  e.preventDefault();
                  this.comicInfo = {};
                  this.searchResult = [];
                  this.imgErrorTimes = {};
                  this.getJmComicInfo();
                }
              }
            });

            // 首次加载时从hash中读取jmid值
            const hash = window.location.hash;
            if (hash && hash.length > 1) {
              this.jmid = hash.substring(1); // 去掉#符号
              this.updateSearch();
              this.getJmComicInfo();
            }

            // 监听hash变化
            window.addEventListener('hashchange', () => {
              const newHash = window.location.hash;
              if (newHash && newHash.length > 1) {
                const newJmid = newHash.substring(1);
                if (this.jmid !== newJmid) {
                  this.jmid = newJmid;
                  this.updateSearch();
                  this.getJmComicInfo();
                }
              } else {
                if (this.jmid !== '') {
                  this.jmid = '';
                  this.updateSearch();
                }
              }
            });

            // 监听输入法状态变化
            window.addEventListener('compositionstart', () => {
              this.imeStatus = true;
            });
            window.addEventListener('compositionend', () => {
              this.imeStatus = false;
              this.jmid = this.formatJMID(this.jmid);
              this.updateSearch();
            });
          },
          proto: {
            formatJMID(jmid) {
              // 去除字符，如果存在文本"JM"，提取到后面的数字部分，否则去除所有非数字字符
              if (/JM?\s*\d*/i.test(jmid)) {
                return jmid.replace(/(JM?)\s*(\d*)/i, '$1$2');
              }
              return jmid.replace(/\D/g, '');
            },
            async getJmComicInfo(jmid = this.jmid) {
              this.clearAlerts();
              if (!/(JM)?\d+/i.test(jmid)) {
                return;
              }
              this.jmid = jmid;
              this.updateSearch();
              this.loadingComicInfo = true;
              this.imgErrorTimes = {};
              try {
                const jmComicInfoResp = await fetch(`/getInfo/${encodeURIComponent(jmid)}`)
                const jmComicInfo = await jmComicInfoResp.json()
                if (jmComicInfo.error) {
                  throw new Error(jmComicInfo.error);
                }
                this.comicInfo = jmComicInfo.comicInfo || {};
                this.searchResult = jmComicInfo.searchResult || [];
              } catch (err) {
                console.error(err);
                this.comicInfoAlert = err.message || '获取漫画信息失败';
              } finally {
                this.loadingComicInfo = false;
              }
            },
            updateSearch() {
              const search = this.shadow.$('#search');
              search.ele.value = this.jmid;
            },
            clearSearch() {
              this.clearAlerts();
              this.jmid = '';
              this.updateSearch();
            },
            copyTitle() {
              if (!this.comicInfo.name) {
                return;
              }
              navigator.clipboard.writeText(this.comicInfo.name).then(() => {
                this.shadow.$('#copySuccess').ele.show();
              });
            },
            clearAlerts() {
              this.comicInfoAlert = '';
            },
            imgUrl(id) {
              if (!id) {
                return '';
              }
              if (!this.imgErrorTimes[id]) {
                this.imgErrorTimes[id] = 0;
              }
              if (this.imgErrorTimes[id] > 2) {
                return '';
              }
              return `https://cdn-msp${['', '2', '3'][this.imgErrorTimes[id] || 0]}.18comic.vip/media/albums/${id}.jpg`
            }
          }
        }
      </script>
    </template>
  </o-app>
</body>
</html>
